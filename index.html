<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photobox</title>
</head>
<link rel="stylesheet" href="src/style.css">
<body>

  <script id="photo-template" type="text/x-handlebars-template">
    <p>{{titre}}</p>
    <img style="max-width: 20%; height: 200px;" src="{{url}}" alt="{{titre}}">
    <p>{{descr}}</p>
    <a href=" https://webetu.iutnc.univ-lorraine.fr{{categorie}}" target="_blank">{{categorie}}</a>
  </script>

  <button id="btn-first-gallery">Première galerie</button>
  <button id="btn-prev-gallery">Galerie précédente</button>
  <button id="btn-load-gallery">Charger la galerie</button>
    <button id="btn-next-gallery">Galerie suivante</button>
    <button id="btn-last-gallery">Dernière galerie</button>


  <div id="la_galerie"></div>

  <div id="la_photo"></div>
  <div id="la_categorie"></div>
  <h2>Commentaires :</h2>
  <div id="les_commentaires"></div>




    

  <script src="dist/bundle.js"></script>
</body>
</html>

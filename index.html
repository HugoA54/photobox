<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photobox</title>
</head>
<link rel="stylesheet" href="src/style.css">
<body>

  <script id="photo-template" type="text/x-handlebars-template">
    <p>{{titre}}</p>
    <img src="{{url}}" alt="{{titre}}">
    <p>{{descr}}</p>
  </script>

  <script id="categorie-template" type="text/x-handlebars-template">
    <p>Catégorie : {{nom}}</p>
  </script>

  <script id="comments-template" type="text/x-handlebars-template">
    <ul>
      {{#each comments}}
      <li>({{pseudo}}) {{content}}</li>
      {{/each}}
    </ul>
  </script>

  <button id="btn-first-gallery">Première galerie</button>
  <button id="btn-prev-gallery">Galerie précédente</button>
  <button id="btn-load-gallery">Charger la galerie</button>
    <button id="btn-next-gallery">Galerie suivante</button>
    <button id="btn-last-gallery">Dernière galerie</button>


  <div id="la_galerie"></div>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close">Fermer</button>
    <button id="lightbox-prev">Précédent</button>
    <span id="lightbox-counter"></span>
    <button id="lightbox-next">Suivant</button>
    <div id="la_photo"></div>
    <div id="la_categorie"></div>
    <h2>Commentaires :</h2>
    <div id="les_commentaires"></div>
  </div>




    

  <script src="dist/bundle.js"></script>
</body>
</html>
